# Masalım — staging on Render's free tier.
#
# Postgres is NOT provisioned here. The database lives on an external managed
# service — the connection string is set by hand in the dashboard — because a
# free Render database has a fixed lifetime and the data outlives it.
#
# One web service does two jobs: it serves HTTP and runs the BullMQ workers in
# the same process (MASALIM_ROLE=all, read in apps/api/src/core/queue/role.ts).
# That is not how this should be deployed for real — a book render occupies the
# same event loop that answers requests — but a free workspace gets one
# always-on process, and the alternative is not being able to open the product
# on a phone at all. docs/deploy/render.md states the cost and the upgrade path.
#
# Native Node build rather than the repository's Dockerfile: Render builds and
# runs on the same machine image, so Prisma's `native` binary target resolves to
# the engine that will actually be used, and the workspace install benefits from
# Render's build cache. The Dockerfile also splits API, worker and migrations
# into three containers, which is the right shape for a paid deploy and the
# wrong shape for a tier that gives you one.
#
# No secrets are stored in this file. The two JWT secrets are generated by
# Render at provision time, the database and Key Value URLs are wired from the
# resources below, and anything a real provider needs is added by hand in the
# service's Environment tab — the entries marked `sync: false` are the ones this
# deploy might plausibly grow into. Nothing here requires a credential: every
# provider is on its mock, which APP_ENV=staging permits and APP_ENV=production
# refuses (apps/api/src/core/config/config.schema.ts).

services:
  - type: web
    name: masalim-api
    runtime: node
    plan: free
    # The private network only reaches resources in the same region, so the
    # Key Value instance and the database below carry the same value. Changing
    # one without the others leaves the API unable to resolve its own backends.
    region: frankfurt
    autoDeployTrigger: commit
    # `/health/ready` also touches Postgres and Redis. Read the caveat in
    # docs/deploy/render.md before trusting it as an outage signal: it answers
    # 200 whether those checks pass or fail.
    healthCheckPath: /health/ready
    # A commit that only touches the mobile app or the operator console has
    # nothing to rebuild here, and a free workspace has a finite build budget.
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    # Corepack activates the pnpm version pinned in package.json's
    # `packageManager` field, so the lockfile is read by the tool that wrote it.
    # The turbo filter builds only what the API imports: `build` declares
    # dependsOn: ["^build"] in turbo.json, so every workspace package the API
    # depends on — including @masalim/database, whose build runs `prisma
    # generate` — is compiled first, and the Expo app and Next.js console are
    # never built.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm exec turbo run build --filter=@masalim/api
    # Migrations run at start-up rather than in a pre-deploy command, which free
    # instances do not get, and rather than in the build, which runs on a
    # different machine from the one holding the private-network route to the
    # database. `prisma migrate deploy` applies only committed migrations, is a
    # no-op when there are none, and takes an advisory lock; a free service is a
    # single instance, so nothing races it. `&&` is deliberate — a schema the
    # code does not expect should stop the boot, not be served around.
    #
    # It is bounded and retried, though, because of what "before the port is
    # bound" costs here. A free instance sleeps after 15 idle minutes, so this
    # command runs again on every wake — every cold start pays a round trip to
    # the database before anything can listen. On 25 and 26 August the keep-warm
    # ping got zero bytes for two full 150-second attempts: not a refusal, not a
    # slow answer, just nothing, which is what a caller sees while a process
    # that never binds a port keeps the router waiting. An unbounded migration
    # is the one step in this line that can produce exactly that, and it can
    # produce it from a hiccup that would have cleared on a second try.
    #
    # 60 seconds is generous for four already-applied migrations — a healthy run
    # is seconds — and a single retry turns one slow connect into a pause rather
    # than an outage. Two failures still stop the boot, and a crash that Render
    # restarts and reports is worth more than a hang it cannot see.
    #
    # NODE_ENV is set here instead of as a service variable because pnpm reads
    # NODE_ENV=production during install and would skip the devDependencies the
    # build needs: nest, tsc, turbo and prisma all live there.
    #
    # API_PORT follows Render's own PORT so the router finds the open socket,
    # and API_BASE_URL follows RENDER_EXTERNAL_URL because the local-disk
    # storage driver signs media URLs against it — left at its default, every
    # image URL the app hands a phone would point at localhost.
    startCommand: >-
      (cd packages/database &&
      (timeout 60 node_modules/.bin/prisma migrate deploy ||
      timeout 60 node_modules/.bin/prisma migrate deploy)) &&
      NODE_ENV=production
      API_PORT="$PORT"
      API_BASE_URL="$RENDER_EXTERNAL_URL"
      node apps/api/dist/main.js
    envVars:
      # Pinned rather than left to Render's default, which moves. The range
      # resolves to the newest 22.x: it satisfies engines.node >= 22 and keeps
      # Corepack bundled, which Node stopped doing in v25.
      - key: NODE_VERSION
        value: '22'
      # staging, not production: it is what allows every provider below to stay
      # on its mock and storage to stay on local disk.
      - key: APP_ENV
        value: staging
      # The whole reason one free instance is enough. `all` makes this process
      # start the queue workers as well as the HTTP listener.
      - key: MASALIM_ROLE
        value: all
      - key: LOG_LEVEL
        value: info
      # Corepack would otherwise ask for confirmation before fetching pnpm.
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: '0'
      # A 512 MB instance cannot run Chromium next to Node, so the browser is
      # not downloaded and book PDF rendering is the one flow that fails here.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: '1'
      # Set by hand in the dashboard, because the database lives outside Render.
      # Use the connection string on port 5432 — a transaction pooler on 6543
      # cannot run migrations, and this service runs them at start-up.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: masalim-keyvalue
          property: connectionString
      # 256-bit random values, generated once at provision and then left alone.
      # The refresh secret doubles as the signing key for local-disk media URLs
      # (apps/api/src/core/storage/storage.module.ts), so rotating it invalidates
      # both sessions and any URL already handed out.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Mock providers. Each name and each value is an enum member in
      # config.schema.ts; a value outside the enum fails the boot with a
      # readable message rather than degrading quietly.
      - key: AI_PROVIDER
        value: mock
      - key: MODERATION_PROVIDER
        value: mock
      - key: IMAGE_PROVIDER
        value: mock
      - key: TTS_PROVIDER
        value: mock
      - key: VOICE_CLONE_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
      - key: SUBSCRIPTION_PROVIDER
        value: mock
      - key: PRINT_PROVIDER
        value: mock
      - key: PUSH_PROVIDER
        value: mock
      - key: ANALYTICS_PROVIDER
        value: noop
      # Local disk on an instance with no persistent volume: uploads survive
      # until the service sleeps or redeploys, which is enough to click through
      # a story and not enough to keep one.
      - key: STORAGE_PROVIDER
        value: local
      # Empty in the dashboard until someone points this deploy at real
      # object storage. Set STORAGE_PROVIDER=s3 in the same pass, and add
      # STORAGE_BUCKET, STORAGE_ENDPOINT and STORAGE_PUBLIC_URL beside them.
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      # Optional. Left unset, the API simply does not report to Sentry.
      - key: SENTRY_DSN
        sync: false

  - type: keyvalue
    name: masalim-keyvalue
    plan: free
    region: frankfurt
    # BullMQ keeps queue and job state in Redis. A policy that evicts keys under
    # memory pressure drops queued jobs without saying so; refusing writes
    # instead turns the same condition into an error someone can see.
    maxmemoryPolicy: noeviction
    # Empty means the private network only. Nothing outside Render needs to
    # reach the queue, and the free instance has no password on its internal URL.
    ipAllowList: []

