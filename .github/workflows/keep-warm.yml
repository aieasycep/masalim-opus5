name: Keep the staging API warm

# Free hosting tiers put an idle instance to sleep, and waking it takes long
# enough that the first request after a quiet hour can exceed the mobile client's
# 30-second timeout. The parent then sees "İnternet bağlantın yok gibi" — honest
# copy for the wrong reason, since their connection is fine and our server was
# asleep.
#
# This ran on a schedule until 14 September and no longer does. Two reasons, and
# the second is the real one:
#
# GitHub's scheduler drifted badly — the gap between runs stretched from the ten
# minutes asked for to two hours — while the host sleeps after fifteen. So it was
# no longer keeping anything warm; every ping was still a cold start. What it had
# become was an uptime check.
#
# And an uptime check that nobody reads costs nothing, but this one was read: it
# woke an agent session on every result, which re-read the whole conversation to
# write one line saying the deploy was still up. Roughly 600k tokens per "no
# change". Over three weeks that was most of what this session spent, and the
# last two outages it reported taught us only that the fix for them was sitting
# unmerged on a branch — nothing the notification could act on.
#
# It stays here because the job itself is sound and one day there will be a
# deploy worth watching. Run it by hand from the Actions tab when you want to
# know whether staging is up. To put it back on a schedule, restore the `schedule`
# trigger below — and pair it with something that reads the result, because a red
# mark nobody looks at is not monitoring.
#
# It does nothing unless the STAGING_API_URL repository variable is set, so a
# fork or a repo without a deploy stays silent rather than failing forever.

on:
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping readiness
        env:
          API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "STAGING_API_URL is not set; nothing to keep warm."
            exit 0
          fi

          # Two attempts, because one is not evidence.
          #
          # GitHub's scheduler drifts — the gap between runs has been anything
          # from 16 to 50 minutes — while the host sleeps after 15 minutes idle.
          # Every ping is therefore a cold start, and a cold start occasionally
          # takes longer than any timeout worth setting. A single slow answer
          # said "the deploy is down" twice when it was merely waking, and a
          # warning that cries wolf is worse than none.
          #
          # The first attempt is what actually starts the wake-up; the second
          # asks again once it has had time. Failing only when both fail keeps
          # the red mark meaningful.
          #
          # curl's own -w prints 000 when the request never completes, so no
          # fallback echo is needed — appending one made the log say
          # "HTTP 000000". `|| true` is there because a non-zero curl exit is an
          # outcome to report, not a reason to stop the script.
          ping() {
            curl -sS -o /tmp/ready.json -w '%{http_code}' --max-time 150 \
              "${API_URL%/}/health/ready" || true
          }

          code=$(ping)
          echo "HTTP $code"
          cat /tmp/ready.json 2>/dev/null || true
          echo

          if [ "$code" != "200" ]; then
            echo "Retrying once; the first request may have been the wake-up call."
            sleep 20
            code=$(ping)
            echo "HTTP $code"
            cat /tmp/ready.json 2>/dev/null || true
            echo
          fi

          # Two consecutive failures mean the deploy really is down, which is
          # worth seeing in the Actions tab rather than swallowing.
          [ "$code" = "200" ]
